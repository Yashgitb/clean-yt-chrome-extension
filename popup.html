<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clean-yt</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Top Master Bar -->
  <div class="top-bar">
    <div class="brand-container">
      <svg class="brand-icon" viewBox="0 0 24 24">
        <path d="M21.58 7.19a2.7 2.7 0 0 0-1.9-1.9C18 4.8 12 4.8 12 4.8s-6 0-7.68.49a2.7 2.7 0 0 0-1.9 1.9C2 8.87 2 12 2 12s0 3.13.42 4.81a2.7 2.7 0 0 0 1.9 1.9C6 19.2 12 19.2 12 19.2s6 0 7.68-.49a2.7 2.7 0 0 0 1.9-1.9C22 15.13 22 12 22 12s0-3.13-.42-4.81zM10 15V9l5.2 3L10 15z"/>
      </svg>
      <span class="brand-title">clean-yt</span>
    </div>
    <div class="master-control">
      <span id="master-status-text" class="status-text active">Active</span>
      <label class="switch">
        <input type="checkbox" id="master-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Section 1: HOMEPAGE -->
  <div class="accordion-section" id="section-homepage">
    <div class="section-header" data-target="section-homepage">
      <svg class="chevron-icon" viewBox="0 0 24 24">
        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
      </svg>
      <span class="section-title">Homepage</span>
    </div>
    <div class="section-body">
      <!-- Hide Homepage Feed -->
      <div class="option-row">
        <span class="option-label">Hide Homepage Feed</span>
        <label class="switch">
          <input type="checkbox" id="hideHomepageFeed" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Nested: Redirect to Subscriptions -->
      <div class="sub-tree">
        <div class="option-row">
          <span class="option-label">Redirect to Subscriptions</span>
          <label class="switch">
            <input type="checkbox" id="redirectSubscriptions">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Hide YouTube Shorts -->
      <div class="option-row">
        <span class="option-label">Hide YouTube Shorts</span>
        <label class="switch">
          <input type="checkbox" id="hideHomeShorts" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Hide Explore More Topics -->
      <div class="option-row">
        <span class="option-label">Hide Explore More Topics</span>
        <label class="switch">
          <input type="checkbox" id="hideExploreTopics" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Clean Homepage Feed -->
      <div class="option-row">
        <span class="option-label">Clean Homepage Feed</span>
        <label class="switch">
          <input type="checkbox" id="cleanHomepageFeed" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Section 2: VIDEO PAGE -->
  <div class="accordion-section" id="section-videopage">
    <div class="section-header" data-target="section-videopage">
      <svg class="chevron-icon" viewBox="0 0 24 24">
        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
      </svg>
      <span class="section-title">Video Page</span>
    </div>
    <div class="section-body">
      <!-- Hide Video Sidebar -->
      <div class="option-row">
        <span class="option-label">Hide Video Sidebar</span>
        <label class="switch">
          <input type="checkbox" id="hideVideoSidebar">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Nested: Sidebar granular options -->
      <div class="sub-tree">
        <div class="option-row">
          <span class="option-label">Hide Recommended Videos</span>
          <label class="switch">
            <input type="checkbox" id="hideRecommendedVideos" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="option-row">
          <span class="option-label">Hide YouTube Shorts</span>
          <label class="switch">
            <input type="checkbox" id="hideVideoShorts" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="option-row">
          <span class="option-label">Hide Playlists</span>
          <label class="switch">
            <input type="checkbox" id="hidePlaylists">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Hide Comments -->
      <div class="option-row">
        <span class="option-label">Hide Comments</span>
        <label class="switch">
          <input type="checkbox" id="hideComments">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Hide Live Chat -->
      <div class="option-row">
        <span class="option-label">Hide Live Chat</span>
        <label class="switch">
          <input type="checkbox" id="hideLiveChat" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Hide End Screen Cards -->
      <div class="option-row">
        <span class="option-label">Hide End Screen Cards</span>
        <label class="switch">
          <input type="checkbox" id="hideEndScreens">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Disable Autoplay -->
      <div class="option-row">
        <span class="option-label">Disable Autoplay</span>
        <label class="switch">
          <input type="checkbox" id="disableAutoplay" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
